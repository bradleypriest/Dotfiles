# Keep installed configuration outside Dropbox as ordinary local copies.
[dotfiles]
"~/.gitconfig" = { source = "gitconfig", mode = "copy" }
"~/.gitattributes" = { source = "gitattributes", mode = "copy" }
"~/.gitignore_global" = { source = "gitignore_global", mode = "copy" }

"~/.zshrc" = { source = "zshrc", mode = "copy" }
"~/.zprofile" = { source = "zprofile", mode = "copy" }

"~/.gemrc" = { source = "gemrc", mode = "copy" }
"~/.irbrc" = { source = "irbrc", mode = "copy" }
"~/.railsrc" = { source = "railsrc", mode = "copy" }

# Retire configuration for tools that are no longer used.
"~/.pryrc" = { mode = "absent" }
"~/.rvmrc" = { mode = "absent" }
